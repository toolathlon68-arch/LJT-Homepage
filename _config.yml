title: Junteng Liu
title_separator: "-"
name: Junteng Liu
description: "Junteng Liu's academic portfolio"
locale: en-US
url: https://toolathlon68-arch.github.io
baseurl: ""
repository: toolathlon68-arch/LJT-Homepage
comments:
  provider: false
author:
  name: Junteng Liu
  bio: "First-year PhD candidate at HKUST NLP Group"
  employer: "Hong Kong University of Science and Technology"
  email: jliugi@connect.ust.hk
  googlescholar: https://scholar.google.com/citations?hl=en&user=tbK9jl4AAAAJ&view_op=list_works&sortby=pubdate
  github: Vicent0205
  twitter: junteng88716710
publication_category:
  manuscripts:
    title: Journal Articles
  conferences:
    title: Conference Papers
include:
  - .htaccess
  - _pages
  - files
exclude:
  - .asset-cache
  - .bundle
  - .github
  - .jekyll-assets-cache
  - .sass-cache
  - CHANGELOG
  - Dockerfile
  - Gemfile
  - LICENSE
  - README
  - talkmap.ipynb
  - talkmap.py
  - talkmap_out.ipynb
  - package.json
  - scripts
  - markdown_generator
keep_files:
  - .git
  - .svn
encoding: utf-8
markdown_ext: markdown,mkdown,mkdn,mkd,md
collections:
  publications:
    output: true
    permalink: /publication/:path/
  talks:
    output: true
    permalink: /talks/:path/
  teaching:
    output: true
    permalink: /teaching/:path/
  portfolio:
    output: true
    permalink: /portfolio/:path/
defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: true
  - scope:
      path: ""
      type: publications
    values:
      layout: single
      author_profile: true
      share: true
      comments: true
  - scope:
      path: ""
      type: talks
    values:
      layout: talk
      author_profile: true
      share: true
  - scope:
      path: ""
      type: teaching
    values:
      layout: single
      author_profile: true
      share: true
      comments: true
  - scope:
      path: ""
      type: portfolio
    values:
      layout: single
      author_profile: true
      share: true
plugins:
  - jekyll-feed
  - jekyll-gist
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-redirect-from
  - jemoji
whitelist:
  - jekyll-feed
  - jekyll-gist
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-redirect-from
  - jemoji
compress_html:
  clippings: all
  ignore:
    envs: development
